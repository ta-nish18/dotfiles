- hosts: localhost
  connection: local
  gather_facts: yes

  # パッケージ導入時に利用者固有のtapまで自動更新して、セットアップ全体が
  # 巻き込まれることを防ぐ。通常のbrew updateには影響しない。
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"

  # -K では become パスワードが変数として参照できず、caskのpkgインストーラ(sudo)に
  # 渡せないため、ここで一度だけ入力して become と cask の両方で使い回す
  vars_prompt:
    - name: sudo_password
      prompt: "sudo password (becomeとHomebrew caskのインストールに使用)"
      private: yes

  vars:
    # リポジトリを~/dotfiles以外へ配置しても動作させる
    dotfiles_dir: "{{ playbook_dir | dirname }}"
    ansible_become_password: "{{ sudo_password }}"

  tasks:
    - name: Run Common tasks
      include_tasks: tasks/common/common.yml

    - name: Run macOS tasks
      include_tasks: tasks/macos/macos.yml
      when: ansible_facts['os_family'] == "Darwin"
