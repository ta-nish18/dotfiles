# 旧構成ではtree-sitter-cliをnpmのグローバル領域へ導入していた。
# Homebrew formulaへ移行する前に、競合する旧npm版だけを削除する。
- name: Check legacy npm tree-sitter-cli
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/lib/node_modules/tree-sitter-cli"
  register: legacy_npm_tree_sitter

- name: Check tree-sitter command link
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/tree-sitter"
    follow: false
  register: tree_sitter_command

- name: Remove legacy npm tree-sitter command link
  ansible.builtin.file:
    path: "{{ homebrew_prefix }}/bin/tree-sitter"
    state: absent
  become: true
  when:
    - legacy_npm_tree_sitter.stat.exists
    - tree_sitter_command.stat.islnk | default(false)
    - (tree_sitter_command.stat.lnk_source | default('')) is search('/lib/node_modules/tree-sitter-cli/cli.js$')

- name: Remove legacy npm tree-sitter-cli package
  ansible.builtin.file:
    path: "{{ homebrew_prefix }}/lib/node_modules/tree-sitter-cli"
    state: absent
  become: true
  when: legacy_npm_tree_sitter.stat.exists

# CUIのインストール
- name: Install Homebrew Packages
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop:
    - navi
    - fzf
    - figlet
    - yazi
    - ffmpegthumbnailer
    - unar
    - jq
    - poppler
    - fd
    - ripgrep
    - zoxide
    - lazygit
    - gh
    - sheldon
    - node
    - python
    - neovim
    - bat
    - thefuck
    - imagemagick
    - tree-sitter-cli

# 既に手動インストール済みのアプリをHomebrewで上書きしない
- name: Check managed GUI applications
  ansible.builtin.stat:
    path: "{{ item.app_path }}"
  loop:
    - { cask: "chatgpt", app_path: "/Applications/ChatGPT.app", min_macos: "13" }
    - { cask: "claude", app_path: "/Applications/Claude.app", min_macos: "13" }
    - { cask: "ghostty", app_path: "/Applications/Ghostty.app", min_macos: "13" }
    - { cask: "zoom", app_path: "/Applications/zoom.us.app" }
    - { cask: "google-gemini", app_path: "/Applications/Gemini.app", min_macos: "15", architectures: ["arm64"] }
    - { cask: "zen", app_path: "/Applications/Zen.app" }
    - { cask: "tailscale-app", app_path: "/Applications/Tailscale.app", min_macos: "13" }
    - { cask: "google-drive", app_path: "/Applications/Google Drive.app", min_macos: "13" }
    - { cask: "basictex", app_path: "/Library/TeX/texbin/pdflatex" }
    - { cask: "skim", app_path: "/Applications/Skim.app" }
    - { cask: "logi-options+", app_path: "/Applications/logioptionsplus.app" }
  register: managed_gui_apps

# pkg形式のcaskは内部でsudoを使うため、パスワードをSUDO_ASKPASS経由で渡す
- name: Install missing Homebrew application casks
  community.general.homebrew_cask:
    name: "{{ item.item.cask }}"
    state: present
    sudo_password: "{{ (sudo_password | default('')) or omit }}"
  loop: "{{ managed_gui_apps.results }}"
  loop_control:
    label: "{{ item.item.cask }}"
  when:
    - not item.stat.exists
    - item.item.min_macos is not defined
      or ansible_facts['distribution_version'] is version(item.item.min_macos, '>=')
    - item.item.architectures is not defined
      or ansible_facts['architecture'] in item.item.architectures

# GUI版TailscaleはアプリにCLIを同梱しているがPATHには入らない。
# アプリ内バイナリはシンボリックリンク経由だと正しく起動しないため、
# 実体をexecする小さなラッパーを~/.local/binへ置く。
- name: Check Tailscale bundled CLI
  ansible.builtin.stat:
    path: /Applications/Tailscale.app/Contents/MacOS/Tailscale
  register: tailscale_bundled_cli

- name: Install tailscale command wrapper
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.local/bin/tailscale"
    mode: "0755"
    content: |
      #!/bin/sh
      exec /Applications/Tailscale.app/Contents/MacOS/Tailscale "$@"
  when: tailscale_bundled_cli.stat.exists

- name: Check latexmk
  ansible.builtin.stat:
    path: /Library/TeX/texbin/latexmk
  register: latexmk_executable

- name: Install latexmk into BasicTeX
  ansible.builtin.command:
    cmd: /Library/TeX/texbin/tlmgr install latexmk
  become: true
  when:
    - not ansible_check_mode
    - not latexmk_executable.stat.exists

- name: Check managed fonts
  ansible.builtin.stat:
    path: "{{ item.font_path }}"
  loop:
    - { cask: "font-hack-nerd-font", font_path: "{{ ansible_facts.env.HOME }}/Library/Fonts/HackNerdFont-Regular.ttf" }
  register: managed_fonts

- name: Install missing Homebrew font casks
  community.general.homebrew_cask:
    name: "{{ item.item.cask }}"
    state: present
    sudo_password: "{{ (sudo_password | default('')) or omit }}"
  loop: "{{ managed_fonts.results }}"
  loop_control:
    label: "{{ item.item.cask }}"
  when: not item.stat.exists
